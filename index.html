<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Un messaggio speciale per la persona che amo.">
    <meta name="theme-color" content="#ff758c">
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'none'; form-action 'none'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self';">
    <title>Per l'Amore della Mia Vita ❤️</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="card" aria-labelledby="title">
      <p class="eyebrow">Una piccola sorpresa</p>
      <h1 id="title">Buon San Valentino Amore Mio ❤️</h1>
      <p class="intro">Ho qualcosa da dirti…</p>
      <button id="loveButton" type="button">Tocca qui 💌</button>
      <p id="message" class="message" role="status" aria-live="polite" aria-atomic="true"></p>
      <noscript>Per vedere il messaggio, abilita JavaScript nel browser.</noscript>
    </main>
    <div id="heartLayer" class="heart-layer" aria-hidden="true"></div>
  </body>
</html>
